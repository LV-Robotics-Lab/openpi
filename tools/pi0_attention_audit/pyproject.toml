[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pi0-attention-audit"
version = "0.1.0"
description = "Reproducible visual and action-expert attention audits for Pi0 robot policies"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "LV Robotics Lab" }]
dependencies = [
  "numpy>=2.4,<2.5",
]

[project.optional-dependencies]
analysis = [
  "matplotlib>=3.10,<3.11",
  "opencv-python>=4.13,<4.14",
  "pandas>=3.0,<3.1",
  "pyarrow>=18,<24",
  "safetensors>=0.7,<0.8",
  "torch>=2.11,<2.12",
  "transformers>=5.8,<5.9",
]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<0.15",
]
[project.scripts]
pi0-attention = "pi0_attention_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
